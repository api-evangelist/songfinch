aid: songfinch
name: Songfinch
description: 'Songfinch is a Chicago-based direct-to-consumer music gifting platform
  that pairs customers with a curated community of independent professional
  singer-songwriters to produce one-of-a-kind personalized songs. A buyer picks an
  artist by genre, mood and tempo, submits the story and details behind the occasion
  through a guided song builder, and the artist writes, records and delivers an
  original recording to a shareable song page, with add-on products spanning lyric
  prints, vinyl, CDs, sheet music, QR plaques, streaming release and rights
  upgrades. Songfinch operates a two-sided marketplace — a consumer storefront plus
  an artist application and artist admin — and has paid out tens of millions of
  dollars to independent artists. It publishes no public developer program, API
  documentation, or machine-readable contract; api.songfinch.com is a private
  first-party application backend for its own storefront.'
